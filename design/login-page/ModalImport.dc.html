<!doctype html>

    <div style="background:rgba(20,12,34,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.14);border-top:none;border-radius:0 0 22px 22px;box-shadow:0 40px 100px rgba(0,0,0,0.6), 0 0 90px rgba(192,38,211,0.15);">

      <div style="display:flex;align-items:center;justify-content:space-between;padding:24px 30px;border-bottom:1px solid rgba(255,255,255,0.1);">

        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A8FBE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18"/><path d="M6 6l12 12"/></svg>
      </div>

      <div style="padding:26px 30px 8px;">

          </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px;">
          <div style="padding:16px 18px;border-radius:14px;background:rgba(255,255,255,0.04);">
            <p style="margin:0 0 4px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:24px;color:#FFFFFF;">24</p>
            <p style="margin:0;font-size:12px;color:#9A8FBE;">Proyectos detectados</p>
          </div>
          <div style="padding:16px 18px;border-radius:14px;background:rgba(255,255,255,0.04);">
            <p style="margin:0 0 4px;font-family:'Unbounded',sans-serif;font-weight:700;font-size:24px;color:#FFFFFF;">186</p>
            <p style="margin:0;font-size:12px;color:#9A8FBE;">Registros históricos</p>

          <div style="display:grid;grid-template-columns:2fr 1.4fr 1fr;padding:11px 16px;font-size:12px;color:#C9B8E8;border-top:1px solid rgba(255,255,255,0.06);">
            <div>Clínica Vital</div><div>Andrea R.</div><div style="color:#34D399;">Nuevo</div>
          </div>
          <div style="display:grid;grid-template-columns:2fr 1.4fr 1fr;padding:11px 16px;font-size:12px;color:#C9B8E8;border-top:1px solid rgba(255,255,255,0.06);">
            <div>Acme Store</div><div>Julián P.</div><div style="color:#F59E0B;">Actualiza</div>
          </div>
          <div style="display:grid;grid-template-columns:2fr 1.4fr 1fr;padding:11px 16px;font-size:12px;color:#C9B8E8;border-top:1px solid rgba(255,255,255,0.06);">
            <div>Grupo Delta Ingeniería</div><div>Andrea R.</div><div style="color:#34D399;">Nuevo</div>

        <div style="padding:10px 20px;border-radius:10px;background:linear-gradient(135deg,#F472C2,#7C3AED);box-shadow:0 0 20px rgba(236,72,201,0.35);font-size:13px;font-weight:700;color:#FFFFFF;">Importar 24 proyectos</div>
      </div>
    </div>
