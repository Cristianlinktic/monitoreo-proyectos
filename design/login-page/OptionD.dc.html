<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=Work+Sans:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; }
    a { color: #B25B3B; }
    a:hover { color: #8F4529; }
  </style>
</helmet>

<div style="position:relative;width:1440px;height:900px;overflow:hidden;background:#F6F1E7;font-family:'Work Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;">

  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 50% 0%, rgba(178,91,59,0.06), transparent 60%);"></div>

  <div style="position:relative;width:460px;display:flex;flex-direction:column;align-items:center;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:18px;margin-bottom:36px;">
      <div style="position:relative;display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:9999px;border:1px solid #C7B896;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B25B3B" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 6a6 6 0 0 1 6 6"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/><path d="M7.76 7.76a6 6 0 0 0 0 8.48"/></svg>
        <div style="position:absolute;top:-1px;right:-1px;width:8px;height:8px;border-radius:9999px;background:#6E8B5E;border:2px solid #F6F1E7;"></div>
      </div>
      <div style="text-align:center;">
        <p style="font-size:10px;letter-spacing:0.22em;text-transform:uppercase;color:#8A7F66;margin:0 0 10px;">LinkTIC — Equipo Marketing</p>
        <h1 style="font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:500;font-size:54px;line-height:1;letter-spacing:-0.01em;margin:0;color:#241E15;">Monitor</h1>
        <p style="font-size:13px;margin:14px 0 0;color:#8A7F66;">Monitoreo diario de proyectos web</p>
      </div>
    </div>

    <div style="width:100%;background:#FFFDF8;border:1px solid #E4DAC5;border-radius:6px;box-shadow:0 24px 48px rgba(60,45,20,0.08);padding:48px 44px;box-sizing:border-box;">

      <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:32px;font-family:'Work Sans',sans-serif;font-size:13px;">
        <span style="padding-bottom:6px;border-bottom:1.5px solid #B25B3B;color:#241E15;font-weight:600;">Iniciar sesión</span>
        <span style="color:#C7B896;">·</span>
        <span style="padding-bottom:6px;color:#A6976F;">Crear cuenta</span>
      </div>

      <div style="display:flex;flex-direction:column;gap:22px;">
        <div style="display:flex;flex-direction:column;gap:8px;">
          <label style="font-size:11px;font-weight:600;color:#8A7F66;text-transform:uppercase;letter-spacing:0.12em;">Correo electrónico</label>
          <div style="width:100%;box-sizing:border-box;padding:6px 2px 10px;border-bottom:1px solid #D8CBAC;font-size:15px;color:#241E15;">usuario@linktic.com</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:8px;">
          <label style="font-size:11px;font-weight:600;color:#8A7F66;text-transform:uppercase;letter-spacing:0.12em;">Contraseña</label>
          <div style="position:relative;">
            <div style="width:100%;box-sizing:border-box;padding:6px 28px 10px 2px;border-bottom:1px solid #D8CBAC;font-size:15px;letter-spacing:2px;color:#241E15;">••••••••</div>
            <span style="position:absolute;right:2px;bottom:10px;color:#A6976F;display:flex;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </div>
        </div>

        <div style="margin-top:8px;width:100%;box-sizing:border-box;padding:13px;border-radius:4px;font-weight:600;font-size:14px;color:#FFFDF8;background:#241E15;display:flex;align-items:center;justify-content:center;gap:10px;">
          Iniciar sesión
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>

    <p style="font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#A6976F;margin:28px 0 0;">LinkTIC © 2026 · Uso interno</p>
  </div>
</div>
</x-dc>
</body>
</html>
