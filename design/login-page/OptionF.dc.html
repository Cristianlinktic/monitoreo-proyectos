<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8B7FD1; }
    a:hover { color: #6F62C4; }
    @keyframes f-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</helmet>

<div style="position:relative;width:1440px;height:900px;overflow:hidden;background:#FBFAFE;font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;align-items:center;justify-content:center;">

  <div style="position:absolute;width:640px;height:640px;top:-180px;left:-160px;border-radius:50%;background:#8B7FD1;opacity:0.14;filter:blur(120px);"></div>
  <div style="position:absolute;width:640px;height:640px;bottom:-200px;right:-160px;border-radius:50%;background:#6FCBA4;opacity:0.14;filter:blur(120px);"></div>

  <div style="position:relative;width:440px;">

    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;margin-bottom:32px;">
      <div style="position:relative;display:flex;align-items:center;justify-content:center;">
        <div style="padding:14px;border-radius:18px;background:linear-gradient(135deg,#8B7FD1,#6FCBA4);box-shadow:0 12px 28px rgba(139,127,209,0.35);">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M12 2a10 10 0 0 1 10 10"/><path d="M12 6a6 6 0 0 1 6 6"/><path d="M4.93 4.93a10 10 0 0 0 0 14.14"/><path d="M7.76 7.76a6 6 0 0 0 0 8.48"/></svg>
        </div>
        <div style="position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:9999px;background:#6FCBA4;border:3px solid #FBFAFE;animation:f-pulse 2s ease-in-out infinite;"></div>
      </div>
      <div style="text-align:center;">
        <p style="font-size:11px;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:#8A84A3;margin:0 0 8px;">LinkTIC · Equipo Marketing</p>
        <h1 style="font-weight:800;font-size:36px;line-height:1;letter-spacing:-0.02em;margin:0;color:#332F45;">Monitor</h1>
        <p style="font-size:13px;margin:10px 0 0;color:#8A84A3;">Monitoreo diario de proyectos web</p>
      </div>
    </div>

    <div style="width:100%;box-sizing:border-box;background:#FFFFFF;border-radius:32px;box-shadow:0 30px 60px rgba(139,127,209,0.18), 0 4px 16px rgba(51,47,69,0.05);padding:40px 36px;">

      <div style="position:relative;display:flex;gap:6px;margin-bottom:26px;padding:5px;border-radius:9999px;background:#F3F1FB;">
        <div style="position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 8px);border-radius:9999px;background:#FFFFFF;box-shadow:0 4px 10px rgba(139,127,209,0.25);"></div>
        <div style="position:relative;flex:1;text-align:center;padding:9px 0;border-radius:9999px;font-size:13px;font-weight:700;color:#6F62C4;">Iniciar sesión</div>
        <div style="position:relative;flex:1;text-align:center;padding:9px 0;border-radius:9999px;font-size:13px;font-weight:600;color:#9A93B8;">Crear cuenta</div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px;">
        <div style="display:flex;flex-direction:column;gap:7px;">
          <label style="font-size:11px;font-weight:700;color:#8A84A3;text-transform:uppercase;letter-spacing:0.08em;">Correo electrónico</label>
          <div style="width:100%;box-sizing:border-box;padding:12px 16px;border-radius:16px;font-size:14px;color:#332F45;background:#F6F4FC;">usuario@linktic.com</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:7px;">
          <label style="font-size:11px;font-weight:700;color:#8A84A3;text-transform:uppercase;letter-spacing:0.08em;">Contraseña</label>
          <div style="position:relative;">
            <div style="width:100%;box-sizing:border-box;padding:12px 42px 12px 16px;border-radius:16px;font-size:14px;color:#332F45;background:#F6F4FC;">••••••••</div>
            <span style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#9A93B8;display:flex;">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </div>
        </div>

        <div style="margin-top:6px;width:100%;box-sizing:border-box;padding:14px;border-radius:9999px;font-weight:700;font-size:14px;color:#FFFFFF;background:linear-gradient(135deg,#8B7FD1,#6FCBA4);box-shadow:0 14px 30px rgba(139,127,209,0.4);display:flex;align-items:center;justify-content:center;gap:8px;">
          Iniciar sesión
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </div>
      </div>
    </div>

    <p style="text-align:center;font-size:11px;font-weight:500;letter-spacing:0.06em;color:#9A93B8;margin:26px 0 0;">LinkTIC © 2026 · Uso interno</p>
  </div>
</div>
</x-dc>
</body>
</html>
